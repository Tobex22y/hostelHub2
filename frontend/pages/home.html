<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelHub — BOUESTI Hostel Portal</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="icon" href="../assets/images/bouestilogo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <header class="site-header">
    <div class="logo_container">
      <img src="../assets/images/bouestilogo.png" alt="BOUESTI" id="logo" />
      <p>HostelHub</p>
    </div>
    <nav class="nav-links">
      <a href="login.html">Student Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="admin_login.html" class="nav-cta">Admin Portal</a>
    </nav>
  </header>

  <section class="home_section">
    <div class="wrapper">

      <div class="hero_content">
        <span class="hero_eyebrow"><i class="fa-solid fa-graduation-cap"></i> BOUESTI — Ikere-Ekiti</span>

        <h1>Your Hostel,<br><span>Sorted Online.</span></h1>

        <p>Book a bed space, track your allocation, and confirm your payment — all in one secure student portal.</p>

        <div class="hero_actions">
          <a href="signup.html" class="btn-primary">Get Started <i class="fa-solid fa-arrow-right"></i></a>
          <a href="login.html" class="btn-outline"><i class="fa-solid fa-right-to-bracket"></i> Sign In</a>
        </div>

        <div style="display:flex; gap:32px; margin-top:24px; flex-wrap:wrap;">
          <div>
            <div style="font-family:var(--font-display);font-size:1.6rem;font-weight:800;color:var(--primary);">6</div>
            <div style="font-size:12px;color:var(--text-muted);font-weight:500;"><i class="fa-solid fa-building" style="color:var(--primary);font-size:18px;"></i> Hall Blocks</div>
          </div>
          <div>
            <div style="font-family:var(--font-display);font-size:1.6rem;font-weight:800;color:var(--primary);">100%</div>
            <div style="font-size:12px;color:var(--text-muted);font-weight:500;"><i class="fa-solid fa-globe" style="color:var(--primary);font-size:18px;"></i> Online Booking</div>
          </div>
          <div>
            <div style="font-family:var(--font-display);font-size:1.6rem;font-weight:800;color:var(--primary);">Secure</div>
            <div style="font-size:12px;color:var(--text-muted);font-weight:500;"><i class="fa-solid fa-shield-alt" style="color:var(--primary);font-size:18px;"></i> Paystack Payments</div>
          </div>
        </div>
      </div>

      <div class="hero_image">
        <img src="../assets/images/hostel.jpg" alt="BOUESTI Hostel" />
      </div>

    </div>
  </section>

  <script src="../config.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
