<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account — HostelHub</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="icon" href="../assets/images/bouestilogo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* extra spacing for tall signup form */
    .signup_section .main-wrapper { min-height: 100vh; align-items: flex-start; }
    .auth-card { margin-bottom: 40px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media(max-width:480px){ .form-row { grid-template-columns: 1fr; } }
    .file-hint { font-size:12px; color:var(--text-muted); margin-top:5px; }
  </style>
</head>
<body class="signup_section">

  <header class="site-header">
    <div class="logo_container">
      <img src="../assets/images/bouestilogo.png" alt="BOUESTI" id="logo" />
      <p>HostelHub</p>
    </div>
    <nav class="nav-links">
      <a href="login.html">Student Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="admin_login.html" class="nav-cta">Admin Portal</a>
    </nav>
  </header>

  <div class="main-wrapper">
    <div class="auth-card">

      <div class="auth-logo"><i class="fa-solid fa-user-plus"></i></div>

      <h1>Create Account</h1>
      <p class="subtitle">Join the BOUESTI residential community. Fill in your details to get started.</p>

      <form id="signupForm" enctype="multipart/form-data">

        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input id="full-name" type="text" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label>Matric Number</label>
            <input id="matric-number" type="text" placeholder="CSC/2022/5151" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="you@student.bouesti.edu.ng" required />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input id="phone" type="tel" placeholder="08012345678" required />
          </div>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select id="signupGender" required>
            <option value="">Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="form-group">
          <label>Profile Picture</label>
          <input id="signupPicture" type="file" accept="image/*" required />
          <p class="file-hint">Clear passport photo (JPG or PNG, max 2MB)</p>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input id="signupPassword" type="password" placeholder="Create password" required />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input id="signupConfirm" type="password" placeholder="Repeat password" required />
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:4px;">
          Create Account <i class="fa-solid fa-user-plus"></i>
        </button>

      </form>

      <div class="footer-link">
        Already registered? <a href="login.html">Sign in</a>
      </div>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../assets/js/signup.js"></script>
</body>
</html>
