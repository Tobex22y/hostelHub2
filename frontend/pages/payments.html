<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments — HostelHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

    :root {
      --primary: #15803d;
      --primary-dark: #14532d;
      --primary-light: #f0fdf4;
      --gold: #d4af37;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --surface: #ffffff;
      --bg: #f8fafc;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
      --shadow-md: 0 4px 12px rgba(15,23,42,.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1,h2,h3,h4 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

    /* ── SIDEBAR (identical to dashboard.html) ── */
    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: var(--primary-dark);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      z-index: 40;
      transition: transform 0.25s;
    }
    .sidebar-brand {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-brand .logo_container { display: flex; align-items: center; gap: 10px; }
    .sidebar-brand img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .sidebar-brand p {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700; font-size: 1.1rem;
      color: white;
    }
    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
    .nav-section-label {
      font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(255,255,255,.35); padding: 10px 12px 4px; margin-top: 6px;
    }
    .nav-link {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
      color: rgba(255,255,255,.72); font-size: 13.5px; font-weight: 500; text-decoration: none;
      transition: background 0.15s, color 0.15s; cursor: pointer; border: none; background: none;
      width: 100%; text-align: left;
    }
    .nav-link:hover { background: rgba(255,255,255,.1); color: white; }
    .nav-link.active { background: rgba(255,255,255,.15); color: white; font-weight: 600; }
    .nav-link .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-link.nav-epass {
      background: rgba(212,175,55,.12); color: var(--gold);
      border: 1px solid rgba(212,175,55,.25); margin-top: 4px;
    }
    .nav-link.nav-epass:hover { background: rgba(212,175,55,.22); color: #f0c040; border-color: rgba(212,175,55,.45); }
    .nav-link.nav-epass .nav-icon { color: var(--gold); }
    .sidebar-footer { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,.1); }

    /* ── MAIN ── */
    .main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ── TOPBAR (identical to dashboard.html) ── */
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 30; box-shadow: var(--shadow);
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-left img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
    .topbar-left h3 { font-size: 14px; font-weight: 600; color: var(--text); }
    .topbar-left p  { font-size: 12px; color: var(--muted); }
    .btn-logout {
      padding: 8px 16px; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn-logout:hover { background: #fee2e2; }

    /* ── PAGE BODY ── */
    .page-body { padding: 28px; flex: 1; }
    .page-header { margin-bottom: 22px; }
    .page-header h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
    .page-header p { color: var(--muted); font-size: 14px; }

    .filter-banner {
      display: none;
      background: var(--primary-light); border: 1px solid #bbf7d0; color: var(--primary-dark);
      padding: 10px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 18px;
    }
    .filter-banner a { color: var(--primary); font-weight: 600; text-decoration: underline; }

    .loading-text { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; grid-column: 1/-1; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: var(--primary);
      border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ROOMS GRID ── */
    .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

    .room-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .15s;
    }
    .room-card:hover { box-shadow: var(--shadow-md); }
    .room-card-head { padding: 18px; }
    .room-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .room-card-top h3 { font-size: 1rem; font-weight: 700; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 999px; text-transform: capitalize;
    }
    .badge.tag-female { background: #fce7f3; color: #be185d; }
    .badge.tag-male   { background: #dbeafe; color: #1d4ed8; }
    .badge.available  { background: var(--primary-light); color: var(--primary); }
    .badge.occupied   { background: #fef2f2; color: var(--danger); }
    .room-meta { display: flex; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
    .room-badges { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .btn-view-beds {
      width: 100%; padding: 10px; background: var(--primary); color: white; border: none;
      border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s; font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .btn-view-beds:hover { background: var(--primary-dark); }
    .btn-view-beds.open { background: var(--primary-dark); }

    /* ── INLINE BED ACCORDION (inside the room card) ── */
    .beds-accordion {
      display: none;
      border-top: 1px solid var(--border);
      background: #fafcfb;
      padding: 16px 18px 20px;
      animation: slideDown .2s ease;
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .acc-error {
      background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
      padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
    }
    .acc-loading { text-align: center; padding: 24px 0; color: var(--muted); font-size: 13px; }
    .acc-loading .spinner { width: 26px; height: 26px; margin-bottom: 8px; }

    .mini-beds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .mini-bed-card {
      background: var(--surface); border: 2px solid var(--border); border-radius: 10px;
      padding: 12px 8px; text-align: center; cursor: pointer; user-select: none;
      transition: border-color .15s, background .15s, transform .1s;
    }
    .mini-bed-card.available:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }
    .mini-bed-card.selected { border-color: var(--primary); background: #dcfce7; }
    .mini-bed-card.occupied { border-color: #fecaca; background: #fef2f2; cursor: not-allowed; opacity: .6; }
    .mini-bed-card.locking { opacity: .7; cursor: wait; }
    .mini-bed-card i { font-size: 18px; margin-bottom: 6px; display: block; }
    .mini-bed-number { font-weight: 700; font-size: 12.5px; }
    .mini-bed-status { font-size: 10px; margin-top: 3px; font-weight: 500; }
    .mini-bed-card.available .mini-bed-status { color: #16a34a; }
    .mini-bed-card.selected .mini-bed-status { color: #15803d; font-weight: 700; }
    .mini-bed-card.occupied .mini-bed-status { color: #dc2626; }
    .beds-empty { color: var(--muted); text-align: center; padding: 20px 0; font-size: 13px; grid-column: 1/-1; }

    /* ── CONFIRM / PAYMENT PANEL (swaps into accordion) ── */
    .confirm-panel { animation: slideDown .2s ease; }
    .detail-card { background: #fefce8; border: 1px solid #fde68a; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .detail-card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #fde68a; font-size: 13px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-row span:first-child { color: var(--muted); }
    .detail-row span:last-child { font-weight: 600; color: var(--text); }
    .countdown-row {
      display: flex; align-items: center; gap: 8px; background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 8px; padding: 9px 14px; font-size: 12.5px; color: #92400e; font-weight: 600; margin-bottom: 12px;
    }
    .status-value { font-weight: 700; margin-left: auto; }
    .price-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 10px; padding: 16px; color: white; margin-bottom: 16px;
    }
    .price-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; opacity: .85; }
    .price-total {
      display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 800;
      font-family: 'Plus Jakarta Sans', sans-serif; border-top: 1px solid rgba(255,255,255,.2);
      padding-top: 10px; margin-top: 2px;
    }
    .action-row { display: flex; gap: 10px; }
    .btn-pay {
      flex: 1; padding: 13px; background: #16a34a; color: white; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s, transform .1s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .btn-pay:hover { background: #15803d; transform: translateY(-1px); }
    .btn-pay:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .btn-change {
      flex: 0 0 auto; padding: 13px 16px; background: transparent; color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .15s, color .15s; font-family: inherit;
    }
    .btn-change:hover { background: var(--bg); color: var(--text); }
    .pay-loading { display: none; text-align: center; padding: 30px; color: var(--muted); }

    /* ── ROOMMATES / ALREADY-ALLOCATED PANEL ── */
    #roommatesSection { display: none; }
    .alloc-summary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: var(--radius); padding: 22px; color: white; margin-bottom: 22px;
      display: flex; align-items: center; gap: 16px;
    }
    .alloc-summary i { font-size: 30px; color: var(--gold); }
    .alloc-summary h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
    .alloc-summary p { font-size: 13px; opacity: .9; }
    .roommates-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px;
    }
    .roommates-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .roommates-panel > p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .roommate-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px;
    }
    .roommate-row.you { background: var(--primary-light); border-color: #bbf7d0; }
    .roommate-left { display: flex; align-items: center; gap: 12px; }
    .roommate-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--primary-dark); color: var(--gold);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
      font-family: 'Plus Jakarta Sans', sans-serif; flex-shrink: 0;
    }
    .roommate-name { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .roommate-matric { font-size: 11.5px; color: var(--muted); }
    .roommate-bed {
      font-size: 12px; font-weight: 700; color: var(--primary-dark); background: #dcfce7;
      padding: 4px 10px; border-radius: 999px;
    }
    .you-tag {
      font-size: 10px; font-weight: 700; color: var(--primary); background: #dcfce7;
      padding: 2px 7px; border-radius: 999px; margin-left: 6px; text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; }
    }
    @media (max-width: 600px) {
      .page-body { padding: 16px; }
      .rooms-grid { grid-template-columns: 1fr; }
      .mini-beds-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo_container">
        <img src="../assets/images/bouestilogo.png" alt="BOUESTI" id="logo" />
        <p>HostelHub</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a class="nav-link" href="dashboard.html">
        <i class="fa-solid fa-home nav-icon"></i> Dashboard
      </a>
      <a class="nav-link" href="room.html">
        <i class="fa-solid fa-bed nav-icon"></i> Book Bed
      </a>
      <a class="nav-link" href="allocation.html">
        <i class="fa-solid fa-list nav-icon"></i> Allocation
      </a>
      <a class="nav-link active" href="payments.html">
        <i class="fa-solid fa-credit-card nav-icon"></i> Payments
      </a>

      <div class="nav-section-label">Support</div>
      <a class="nav-link" href="dashboard.html?section=maintenance">
        <i class="fa-solid fa-screwdriver-wrench nav-icon"></i> Maintenance
      </a>

      <div class="nav-section-label">Account</div>
      <a class="nav-link" href="profile.html">
        <i class="fa-solid fa-user nav-icon"></i> Profile
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-link" style="width:100%;background:rgba(239,68,68,.12);color:#fca5a5;border:none;" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket nav-icon"></i> Logout
      </button>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <div class="main">

    <div class="topbar">
      <div class="topbar-left">
        <img id="studentAvatar"
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
          alt="Avatar" />
        <div>
          <h3 id="welcomeName">Welcome, Student</h3>
          <p>BOUESTI Hostel Portal</p>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="page-body">
      <div class="page-header">
        <h1>Payments</h1>
        <p>This page is under construction.</p>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:48px 24px;text-align:center;">
        <i class="fa-solid fa-credit-card" style="font-size:40px;color:var(--primary);margin-bottom:16px;display:block;"></i>
        <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:8px;">Coming Soon</h2>
        <p style="color:var(--muted);font-size:14px;max-width:420px;margin:0 auto;">
          We're still building the Payments page. In the meantime you can head back to your
          <a href="dashboard.html" style="color:var(--primary);font-weight:600;">Dashboard</a>.
        </p>
      </div>
    </div>
  </div>

<script src="../config.js"></script>
<script>
  async function logout() {
    try {
      await fetch(CONFIG.API_BASE_URL + '/auth/logout.php', { method: 'POST', credentials: 'include' });
    } catch (e) { /* ignore network errors on logout */ }
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
