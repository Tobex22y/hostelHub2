<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In — HostelHub</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="icon" href="../assets/images/bouestilogo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <header class="site-header">
    <div class="logo_container">
      <img src="../assets/images/bouestilogo.png" alt="BOUESTI" id="logo" />
      <p>HostelHub</p>
    </div>
    <nav class="nav-links">
      <a href="login.html">Student Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="admin_login.html" class="nav-cta">Admin Portal</a>
    </nav>
  </header>

  <div class="main-wrapper">
    <div class="auth-card">

      <div class="auth-logo"><i class="fa-solid fa-user"></i></div>

      <h1>Welcome back</h1>
      <p class="subtitle">Enter your matric number and password to access your hostel portal.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginMatric">Matric Number</label>
          <input type="text" id="loginMatric" placeholder="e.g. BST/2023/001" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:8px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>

      <div class="footer-link">
        New student? <a href="signup.html">Create an account</a>
      </div>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
