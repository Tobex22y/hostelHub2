<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — HostelHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
    :root{--primary:#14532d;--accent:#d4af37;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--radius:12px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e3a2f 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif}
    .card{background:#ffffff;border-radius:20px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
    .admin-badge{display:inline-flex;align-items:center;gap:8px;background:#fef9e7;border:1px solid #fde68a;color:#92400e;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:20px}
    h2{font-size:1.6rem;color:var(--text);margin-bottom:6px}
    .sub{font-size:13px;color:var(--muted);margin-bottom:32px}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
    .form-group input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius);background:#f8fafc;color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
    .form-group input:focus{outline:none;border-color:#15803d;box-shadow:0 0 0 3px rgba(21,128,61,.12)}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,#15803d,#14532d);color:white;border:none;border-radius:var(--radius);font-weight:700;font-size:15px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:opacity .15s,transform .1s;margin-top:4px}
    .btn:hover{opacity:.92;transform:translateY(-1px)}
    .status{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:13px;text-align:center;display:none}
    .status.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;display:block}
    .status.success{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;display:block}
    .footer{margin-top:20px;text-align:center;font-size:12px;color:var(--muted)}
    .back-link{display:block;text-align:center;margin-top:14px;font-size:13px;color:#64748b;text-decoration:none}
    .back-link:hover{color:#15803d}
  </style>
</head>
<body>
  <div class="card">
    <div class="admin-badge"><i class="fa-solid fa-shield-halved"></i> Admin Access</div>
    <h2>Admin Portal</h2>
    <p class="sub">HostelHub Management System — restricted to authorised staff only.</p>

    <div class="form-group">
      <label for="adminEmail">Email Address</label>
      <input type="email" id="adminEmail" placeholder="admin@bouesti.edu.ng" autocomplete="email"/>
    </div>

    <div class="form-group">
      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn" id="adminLoginBtn"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Admin Panel</button>

    <div class="status" id="adminStatus"></div>

    <a href="login.html" class="back-link"><i class="fa-solid fa-chevron-left"></i> Back to Student Portal</a>

    <div class="footer">© 2026 BOUESTI HostelHub · Admin System</div>
  </div>

  <script src="../config.js"></script>
  <script src="../assets/js/admin_login.js"></script>
</body>
</html>
